<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KOMA - 出品写真の撮影リスト</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2b303b;--tx:#e9ecf2;--mut:#98a1b0;--acc:#5aa9ff;--ok:#2fd27a;--warn:#f5b83d;--ng:#ff5d5d;
  --safe:env(safe-area-inset-bottom,0px);--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--r-lg:14px;--r-md:10px;--r-sm:8px;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation;cursor:pointer}
header{flex:none;display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;letter-spacing:.12em}
header .t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:36px;padding:0 var(--sp3);font-size:14px;flex:none}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--sp3) var(--sp3) calc(40px + var(--safe))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp3);margin-bottom:var(--sp2)}
.row{display:flex;gap:var(--sp2);align-items:center}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp3);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04203f;font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#03240f;font-weight:700}
.btn.dng{color:var(--ng)}
.btn.sm{height:34px;padding:0 var(--sp2);font-size:12px;border-radius:var(--r-sm)}
.btns{display:flex;gap:var(--sp2);flex-wrap:wrap}
.note{font-size:12px;color:var(--mut)}
.sec{font-size:13px;color:var(--mut);margin:var(--sp4) var(--sp1) var(--sp2);font-weight:700}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.badge.done{color:var(--ok);border-color:var(--ok)}
.badge.req{color:var(--warn);border-color:var(--warn)}
.badge.cover{color:#04203f;background:var(--acc);border-color:var(--acc);font-weight:700}
.prog{font-family:var(--mono);font-weight:700}
.guide{background:#13243a;border:1px solid #24466e;color:#bcd8ff;border-radius:var(--r-md);padding:var(--sp2) var(--sp3);font-size:13px;margin-bottom:var(--sp2)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.seg button{flex:1;background:var(--card2);border:0;border-left:1px solid var(--line);height:36px;font-size:13px;color:var(--mut)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:#04203f;font-weight:700}
.flag{display:grid;grid-template-columns:52px 1fr;gap:var(--sp2);align-items:center;margin-bottom:var(--sp2)}
.flag>span{font-size:13px;color:var(--mut)}
.shot{display:grid;grid-template-columns:84px 1fr;gap:var(--sp3)}
.thumb{width:84px;height:84px;border-radius:var(--r-sm);background:var(--card2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--mut);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.shot .lb{font-weight:700}
.shot .gd{font-size:12px;color:#bcd8ff;margin:2px 0 6px}
.model{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-bottom:6px}
.model img{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
label.pick{position:relative;overflow:hidden}
label.pick input{position:absolute;inset:0;opacity:0;font-size:0}
.fld{margin-bottom:var(--sp3)}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:var(--sp1)}
.fld input,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp2)}
.chk{width:22px;height:22px;accent-color:var(--acc);flex:none}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + 12px) var(--sp3) var(--sp3);border-bottom:1px solid var(--line)}
#sheet .sh h2{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sb{flex:1;overflow:auto;padding:var(--sp3) var(--sp3) calc(40px + var(--safe))}
.pv{position:relative;display:block;margin:0 auto var(--sp3);max-width:100%;width:fit-content}
.pv img{display:block;max-width:100%;max-height:52vh;border-radius:var(--r-sm)}
.pv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cropbox{position:relative;width:min(340px,100%);aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:var(--r-sm);background:#000;touch-action:none;outline:2px solid #ffe100}
.cropbox img{position:absolute;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.cropbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cropbox svg line{stroke:#fff;stroke-opacity:.7;stroke-width:1}
.cropbox svg line.c{stroke:#5aa9ff;stroke-dasharray:6}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.cmp img{width:100%;border-radius:var(--r-sm)}
.cmp .note{text-align:center;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:70;background:#2a3140;color:#fff;padding:var(--sp3) var(--sp4);border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.inline{display:flex;gap:var(--sp2)}
.inline input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-md);height:44px;padding:0 var(--sp2)}
</style>
</head>
<body>
<header id="hd"></header>
<main id="view"></main>
<div id="sheet" hidden><div class="sh"><h2 id="shT"></h2><button class="btn sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<div id="toast"></div>
<script>
'use strict';
const APP_VER='1.0.2';
const KEY='koma_v1';
const SETK=['単品','途中セット','全巻セット','その他'];
const DEFS={
  whole:{label:'全体（表紙側）',guide:'正面から。本全体が入り、上下左右に少し余白'},
  spine:{label:'背表紙・巻数の並び',guide:'正面・水平。本の高さいっぱいに写し、背表紙の文字が読める距離'},
  coverup:{label:'表紙アップ',guide:'正面から。表紙いっぱいに写し、タイトルの文字が読める距離'},
  edge:{label:'小口・天側',guide:'立てた本を斜め上から。小口の面が見える角度'},
  okuduke:{label:'奥付（初版の証拠）',guide:'刷数の文字が読める距離で正面から。ピント優先'},
  obi:{label:'帯アップ',guide:'帯の文字が読める距離で正面から'},
  bonus:{label:'特典・付属品',guide:'平置き俯瞰。全部が1枚に入る構図'},
  cond:{label:'状態が気になる箇所',guide:'傷・汚れに寄って撮影。場所が分かるよう少し引いた版も任意で'},
  narabi:{label:'表紙並べ（巻順）',guide:'表紙を巻順に並べて真上から。多い場合は複数枚に分けてもよい'}
};
const READABLE=['okuduke','obi'];   // 文字が読めることが価値の証拠写真（分割合成しない）

/* ---------- 保存（メタはlocalStorage、写真はIndexedDB） ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function defState(){return{ver:1,items:[],models:{},settings:{postaUrl:'https://furumusx.github.io/posta/'}}}
function fix(s){const d=defState();if(!s||typeof s!=='object')return d;if(!Array.isArray(s.items))s.items=[];if(!s.models||typeof s.models!=='object')s.models={};s.settings=Object.assign(d.settings,s.settings||{});return s}
let S=(()=>{try{const t=localStorage.getItem(KEY);if(t)return fix(JSON.parse(t))}catch(e){}return defState()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('保存できませんでした');return false}}
let DBP=null;
function db(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{const r=indexedDB.open('koma',1);r.onupgradeneeded=()=>{r.result.createObjectStore('imgs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return DBP}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('imgs',mode);const st=t.objectStore('imgs');let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const idbGet=id=>tx('readonly',st=>st.get(id));
const idbPut=rec=>tx('readwrite',st=>st.put(rec));
const idbDel=id=>tx('readwrite',st=>st.delete(id));
const idbClear=()=>tx('readwrite',st=>st.clear());
const idbAll=()=>tx('readonly',st=>st.getAll());
const URLS=new Map();
const isPlain=ed=>!ed||(!ed.rot&&!ed.square&&!ed.auto);
const srcOf=r=>r&&(r.orig||r.cur)||null;
async function shotURL(id,ed,max){if(!id)return null;const k=id+'|'+JSON.stringify(ed||{})+'|'+(max||0);if(URLS.has(k))return URLS.get(k);
  const r=await idbGet(id);const src=srcOf(r);if(!src)return null;const b=(isPlain(ed)&&!max)?src:await renderEdit(src,ed||{},max);const u=URL.createObjectURL(b);URLS.set(k,u);return u}
const imgURL=id=>shotURL(id,{},0);
async function shotBlob(s){const r=await idbGet(s.imgId);const src=srcOf(r);if(!src)return null;return isPlain(s.edit)?src:renderEdit(src,s.edit,0)}
function dropURL(id){for(const [k,u] of [...URLS])if(k.startsWith(id+'|')){URL.revokeObjectURL(u);URLS.delete(k)}}

/* ---------- 小道具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
const getI=id=>S.items.find(i=>i.id===id)||null;
const isSet=it=>it.setk==='途中セット'||it.setk==='全巻セット';
function mapSetk(v){v=String(v||'').normalize('NFKC');if(!v)return '単品';if(/全巻/.test(v))return '全巻セット';if(/途中|バラ|^セット$|partial|bara/.test(v))return '途中セット';if(/単/.test(v)||v==='single')return '単品';if(v==='set')return '全巻セット';return SETK.includes(v)?v:'その他'}
const tri=v=>['all','part','none'].includes(v)?v:'none';

/* ============================================================
   動的撮影リスト
   ============================================================ */
function reqKeys(it){const k=['whole',isSet(it)?'spine':'coverup','edge'];
  if(it.shoban==='all'||it.shoban==='part')k.push('okuduke');if(it.obi==='all'||it.obi==='part')k.push('obi');if(it.bonus)k.push('bonus');if(it.condBad)k.push('cond');return k}
const coverKey=it=>isSet(it)?'spine':'whole';
function canon(it){const k=reqKeys(it);const ck=coverKey(it);return [ck,...k.filter(x=>x!==ck)]}   // 初期の並び：カバー推奨を先頭、以降は表の順
function mkShot(key,required){return{key,label:DEFS[key]?DEFS[key].label:key,required,imgId:null,cover:false}}
function finalize(it){it.shots.forEach((s,i)=>{s.cover=i===0});const req=it.shots.filter(s=>s.required);it.status=req.length&&req.every(s=>s.imgId)?'撮影完了':'撮影中';it.updatedAt=Date.now()}
function regen(it){
  const need=reqKeys(it),order=canon(it),rank=k=>{const i=order.indexOf(k);return i<0?1e9:i};
  // 必須でなくなった未撮影の自動ショットは外す。撮影済みは残す（任意扱いに）
  it.shots=it.shots.filter(s=>s.custom||s.imgId||need.includes(s.key)||s.optional);
  it.shots.forEach(s=>{if(!s.custom&&!s.optional)s.required=need.includes(s.key)});
  for(const k of order){if(it.shots.some(s=>s.key===k&&!s.custom))continue;const ns=mkShot(k,true);
    const at=it.shots.findIndex(s=>rank(s.key)>rank(k));if(at<0)it.shots.push(ns);else it.shots.splice(at,0,ns)}
  finalize(it)}
function newItem(o){const it=Object.assign({id:uid(),sssId:'',postaId:'',title:'',work:'',setk:'単品',shoban:'none',obi:'none',bonus:false,condBad:false,shots:[],status:'撮影中',banner:{on:false,text:''},createdAt:Date.now(),updatedAt:Date.now()},o);
  it.shots=canon(it).map(k=>mkShot(k,true));finalize(it);return it}
function progress(it){const r=it.shots.filter(s=>s.required);return{done:r.filter(s=>s.imgId).length,all:r.length,photos:it.shots.filter(s=>s.imgId).length}}

/* ---------- カバー文字入れの初期文言 ---------- */
function summary(it){if(it.shoban==='all'&&it.obi==='all')return '【初版・帯付き】';if(it.shoban==='all'&&it.obi!=='all')return '【初版】';if(it.obi==='all'&&it.shoban==='none')return '【帯付き】';return ''}
function workOf(it){if(it.work)return it.work;let s=String(it.title||'').replace(/【[^】]*】/g,' ');
  s=s.replace(/\s+\d{1,3}\s*[-〜~ー]\s*\d{1,3}\s*巻?.*$/,'').replace(/\s+第?\d{1,3}\s*巻.*$/,'').replace(/\s+(全巻セット|途中セット|完結セット|セット)\s*$/,'');return s.trim()||String(it.title||'').trim()}
function volOf(it){const t=String(it.title||'').normalize('NFKC');let m=t.match(/(\d{1,3})\s*[-〜~ー]\s*(\d{1,3})\s*巻?/);if(m)return `${m[1]}〜${m[2]}巻`;m=t.match(/(\d{1,3})\s*巻/);return m?`${m[1]}巻`:''}
function bannerDefault(it){const w=workOf(it);const v=/巻$/.test(w)?'':volOf(it);return `${summary(it)}${w}${v?' '+v:''}`.trim()}
const bannerText=it=>(it.banner&&it.banner.text)||bannerDefault(it);

/* ============================================================
   画像処理（取り込み圧縮・簡易編集・合成）
   ============================================================ */
async function bitmap(blob){if(window.createImageBitmap){try{return await createImageBitmap(blob)}catch(e){}}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('画像を読み込めません'))};im.src=u})}
const W=b=>b.width||b.naturalWidth,H=b=>b.height||b.naturalHeight;
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const toBlob=(c,q=0.9)=>new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
async function compress(file){const bm=await bitmap(file);const s=Math.min(1,1600/Math.max(W(bm),H(bm)));const c=cv(Math.round(W(bm)*s),Math.round(H(bm)*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);return toBlob(c,0.82)}
function autoLevel(c){const x=c.getContext('2d');const d=x.getImageData(0,0,c.width,c.height),a=d.data;const h=new Uint32Array(256);let n=0;
  for(let i=0;i<a.length;i+=16){h[(a[i]*.299+a[i+1]*.587+a[i+2]*.114)|0]++;n++}
  let lo=0,hi=255,acc=0;for(let v=0;v<256;v++){acc+=h[v];if(acc>=n*0.01){lo=v;break}}acc=0;for(let v=255;v>=0;v--){acc+=h[v];if(acc>=n*0.01){hi=v;break}}
  if(hi-lo<16)return;const sc=255/(hi-lo);for(let i=0;i<a.length;i+=4){for(let k=0;k<3;k++){const v=(a[i+k]-lo)*sc;a[i+k]=v<0?0:v>255?255:v}}x.putImageData(d,0,0)}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function cropRect(sw,sh,cr){cr=cr||{};const sc=clamp(cr.scale||1,1,4);const side=Math.min(sw,sh)/sc;const cx=sw/2+clamp(cr.x||0,-1,1)*(sw-side)/2,cy=sh/2+clamp(cr.y||0,-1,1)*(sh-side)/2;return{sx:cx-side/2,sy:cy-side/2,side}}
async function rotated(orig,rot){const bm=await bitmap(orig);const w=W(bm),h=H(bm),r=((rot||0)%4+4)%4;const sw=r%2?h:w,sh=r%2?w:h;
  const c=cv(sw,sh);const x=c.getContext('2d');x.translate(sw/2,sh/2);x.rotate(r*Math.PI/2);x.drawImage(bm,-w/2,-h/2);return c}
async function renderEdit(orig,ed,max){let c=await rotated(orig,ed.rot);
  if(ed.square){const {sx,sy,side}=cropRect(c.width,c.height,ed.crop);const o=Math.round(max?Math.min(side,max):side);const c2=cv(o,o);c2.getContext('2d').drawImage(c,sx,sy,side,side,0,0,o,o);c=c2}
  else if(max&&Math.max(c.width,c.height)>max){const k=max/Math.max(c.width,c.height);const c2=cv(Math.round(c.width*k),Math.round(c.height*k));c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);c=c2}
  if(ed.auto)autoLevel(c);return toBlob(c,max?0.8:0.9)}
async function withBanner(blob,text){const bm=await bitmap(blob);const c=cv(W(bm),H(bm));const x=c.getContext('2d');x.drawImage(bm,0,0);
  const L=bannerLayout(x,c.width,text);
  x.fillStyle='#ffe100';x.fillRect(0,0,c.width,L.bh);   // v1.0.2：帯は横幅いっぱい・高さ固定（文字数で変えない）
  x.save();x.beginPath();x.rect(0,0,c.width,L.bh);x.clip();
  x.font=L.font;x.fillStyle='#111';x.textAlign='left';x.textBaseline='middle';x.fillText(text,L.pad,L.bh/2+L.fs*0.04);x.restore();return toBlob(c,0.92)}
// 帯の寸法：高さは基準文字サイズで固定。文字は左寄せ・開始位置固定。収まらなければ下限まで縮小（改行しない）
const BN_FONT=n=>`900 ${n}px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif`;
function bannerLayout(x,w,text){const base=Math.round(w*0.065),bh=Math.round(base*1.75),pad=Math.round(w*0.04),avail=w-pad*2,min=Math.max(10,Math.round(base*0.5));
  let fs=base;x.font=BN_FONT(fs);while(fs>min&&x.measureText(text).width>avail){fs--;x.font=BN_FONT(fs)}
  return{bh,pad,fs,font:BN_FONT(fs),fits:x.measureText(text).width<=avail,shrunk:fs<base}}
function bannerFits(text){if(!text)return true;const c=cv(1200,10);return bannerLayout(c.getContext('2d'),1200,text).fits}
async function collage(blobs,n){const SZ=1600,cell=SZ/n,g=6;const c=cv(SZ,SZ);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,SZ,SZ);
  for(let i=0;i<blobs.length&&i<n*n;i++){const bm=await bitmap(blobs[i]);const w=W(bm),h=H(bm),inner=cell-g*2;const s=Math.max(inner/w,inner/h);const sw=inner/s,sh=inner/s;
    x.drawImage(bm,(w-sw)/2,(h-sh)/2,sw,sh,(i%n)*cell+g,Math.floor(i/n)*cell+g,inner,inner)}
  return toBlob(c,0.82)}

/* ============================================================
   画面
   ============================================================ */
const UI={view:'list',sel:{},grid:false,prepared:null};
function hd(){const h=$('#hd');
  if(UI.view==='list')h.innerHTML=`<h1>KOMA</h1><span class="t"></span><button class="hb" data-act="openSet">⚙ 設定</button>`;

    if(s.imgId){const u=await shotURL(s.imgId,s.edit,360);if(UI.view!==v)return;const e=$('#th'+i);if(e)e.innerHTML=u?`<img src="${u}" alt="">`:'写真データなし<br>（再取り込み）'}
    const m=S.models[s.key];if(m){const u=await imgURL(m);const e=$('#md'+i);if(e&&u)e.src=u}}}

function openSheet(t,h){$('#shT').textContent=t;$('#shB').innerHTML=h;$('#sheet').hidden=false;$('#shB').scrollTop=0}
function closeSheet(){$('#sheet').hidden=true;$('#shB').innerHTML=''}
function gridSVG(img){const w=img.naturalWidth,h=img.naturalHeight;const m=Math.min(w,h);const x0=(w-m)/2,y0=(h-m)/2;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${[1,2].map(k=>`<line x1="${w*k/3}" y1="0" x2="${w*k/3}" y2="${h}" stroke="#fff" stroke-opacity=".7" stroke-width="${w/400}"/><line x1="0" y1="${h*k/3}" x2="${w}" y2="${h*k/3}" stroke="#fff" stroke-opacity=".7" stroke-width="${w/400}"/>`).join('')}
  <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="#5aa9ff" stroke-dasharray="${w/60}" stroke-width="${w/300}"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#5aa9ff" stroke-dasharray="${w/60}" stroke-width="${w/300}"/>
  <rect x="${x0}" y="${y0}" width="${m}" height="${m}" fill="none" stroke="#ffe100" stroke-width="${w/200}"/></svg>`}
function wireGrid(){document.querySelectorAll('.pv img').forEach(img=>{const go=()=>{const old=img.parentNode.querySelector('svg');if(old)old.remove();if(UI.grid)img.insertAdjacentHTML('afterend',gridSVG(img))};if(img.complete&&img.naturalWidth)go();else img.onload=go})}
let EDI=null;
async function openEdit(i){const it=getI(UI.view);const s=it.shots[i];if(!s||!s.imgId)return;const ed=s.edit||{};
  const r=await idbGet(s.imgId);const src=srcOf(r);if(!src){toast('写真データがありません');return}
  const u=await shotURL(s.imgId,ed,1200);const rc=await rotated(src,ed.rot);const rb=await toBlob(rc,0.8);
  if(EDI&&EDI.rotURL)URL.revokeObjectURL(EDI.rotURL);EDI={id:it.id,i,rotURL:URL.createObjectURL(rb),w:rc.width,h:rc.height,crop:Object.assign({x:0,y:0,scale:1},ed.crop||{})};
  openSheet(`編集：${s.label}`,`<div class="pv"><img id="edImg" src="${u||''}" alt=""></div>
  <div class="btns"><button class="btn ${ed.auto?'pri':''}" data-act="eAuto">✨ 自動補正${ed.auto?'（ON）':''}</button><button class="btn" data-act="eRot">⟳ 回転</button><button class="btn" data-act="eSq">${ed.square?'1:1をやめる（元画角）':'1:1にする'}</button><button class="btn" data-act="eUndo">元に戻す</button></div>
  ${ed.square?`<div class="sec">画角調整（写真をドラッグで移動・スライダーで拡大）</div>
  <div id="cropBox" class="cropbox"><img id="cropImg" src="${EDI.rotURL}" alt="" draggable="false"></div>
  <div class="row" style="margin-top:8px"><span class="note">縮小</span><input id="cropZ" type="range" min="1" max="3" step="0.01" value="${EDI.crop.scale}" class="grow"><span class="note">拡大</span><button class="btn sm" data-act="cropReset">中央に戻す</button></div>`:''}
  <label class="row" style="margin-top:12px"><input type="checkbox" class="chk" id="gridOn" ${UI.grid?'checked':''}> グリッド（三分割＋中央線＋1:1枠）を表示</label>
  <div class="note" style="margin-top:8px">写真は取り込んだまま（元の画角）で保存し、編集は表示と書き出しのときに反映します。「元に戻す」でいつでも取り込み直後（1:1・中央）の状態に戻せます。</div>`);
  wireGrid();if(ed.square)wireCrop()}
function cropGrid(){const b=$('#cropBox');if(!b)return;const o=b.querySelector('svg');if(o)o.remove();if(!UI.grid)return;
  b.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 300 300" preserveAspectRatio="none"><line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="0" y1="100" x2="300" y2="100"/><line x1="0" y1="200" x2="300" y2="200"/><line class="c" x1="150" y1="0" x2="150" y2="300"/><line class="c" x1="0" y1="150" x2="300" y2="150"/></svg>`)}
function placeCrop(){const b=$('#cropBox'),im=$('#cropImg');if(!b||!im||!EDI)return;const box=b.clientWidth;const {sx,sy,side}=cropRect(EDI.w,EDI.h,EDI.crop);const k=box/side;
  im.style.width=EDI.w*k+'px';im.style.height=EDI.h*k+'px';im.style.left=(-sx*k)+'px';im.style.top=(-sy*k)+'px'}
function setCropCenter(cx,cy){const {side}=cropRect(EDI.w,EDI.h,EDI.crop);const fx=EDI.w>side?(clamp(cx,side/2,EDI.w-side/2)-EDI.w/2)/((EDI.w-side)/2):0;const fy=EDI.h>side?(clamp(cy,side/2,EDI.h-side/2)-EDI.h/2)/((EDI.h-side)/2):0;EDI.crop.x=fx;EDI.crop.y=fy}
let cropT=null;
function commitCrop(){clearTimeout(cropT);cropT=setTimeout(async()=>{const it=getI(EDI.id);const s=it&&it.shots[EDI.i];if(!s)return;
  s.edit=Object.assign({},s.edit||{},{crop:{x:+EDI.crop.x.toFixed(4),y:+EDI.crop.y.toFixed(4),scale:+(+EDI.crop.scale).toFixed(3)}});dropURL(s.imgId);it.updatedAt=Date.now();UI.prepared=null;save();
  const u=await shotURL(s.imgId,s.edit,1200);const e=$('#edImg');if(e&&u)e.src=u;fillImgs(it)},250)}
function wireCrop(){const b=$('#cropBox'),im=$('#cropImg');if(!b)return;const go=()=>{placeCrop();cropGrid()};if(im.complete&&im.naturalWidth)go();else im.onload=go;
  let st=null;b.addEventListener('pointerdown',e=>{const {sx,sy,side}=cropRect(EDI.w,EDI.h,EDI.crop);st={x:e.clientX,y:e.clientY,cx:sx+side/2,cy:sy+side/2,k:b.clientWidth/side};try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointermove',e=>{if(!st)return;setCropCenter(st.cx-(e.clientX-st.x)/st.k,st.cy-(e.clientY-st.y)/st.k);placeCrop()});
  const end=()=>{if(st){st=null;commitCrop()}};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  const z=$('#cropZ');z.addEventListener('input',()=>{EDI.crop.scale=+z.value;placeCrop()});z.addEventListener('change',()=>commitCrop())}
async function applyEdit(mut){const it=getI(EDI.id);const s=it.shots[EDI.i];s.edit=Object.assign({},s.edit||{});mut(s);dropURL(s.imgId);it.updatedAt=Date.now();UI.prepared=null;save();await openEdit(EDI.i);fillImgs(it)}

/* ---------- 取り込み ---------- */
async function importPhoto(i,file){const it=getI(UI.view);const s=it.shots[i];if(!s)return;toast('取り込み中…');
  let blob;try{blob=await compress(file)}catch(e){toast('画像を読み込めませんでした');return}
  if(s.imgId){await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId)}
  const id=uid();await idbPut({id,orig:blob,at:Date.now()});s.imgId=id;s.base={square:true,crop:{x:0,y:0,scale:1}};s.edit=JSON.parse(JSON.stringify(s.base));finalize(it);save();UI.prepared=null;render2();
  toast(it.status==='撮影完了'?'必須ショットがそろいました（撮影完了）':'取り込みました')}
function fromSSSItem(o){const txt=[o.name,Array.isArray(o.tags)?o.tags.join(' '):o.tags,o.memo,o.ed].join(' ').normalize('NFKC');
  const acc=o.acc||{};let shoban='none',obi='none';
  if(/一部初版|初版一部|初版は一部/.test(txt))shoban='part';else if(/初版/.test(txt))shoban='all';
  if(acc.obi==='no'||/帯なし/.test(txt))obi='none';else if(/一部帯|帯一部|帯は一部/.test(txt))obi='part';else if(acc.obi==='yes'||/帯/.test(txt))obi='all';
  const bonus=acc.booklet==='yes'||acc.poster==='yes'||/特典|付録/.test(txt);
  const condBad=/傷や汚れあり|状態が悪い/.test(String(o.cond||''));
  return newItem({sssId:String(o.id),title:String(o.name||''),work:String(o.work||''),setk:mapSetk(o.setk||(o.range&&/\d+\s*[-〜]\s*\d+/.test(o.range)?'途中セット':'')),shoban,obi,bonus,condBad})}
async function sssImport(file){let o;try{o=JSON.parse(await file.text())}catch(e){toast('JSONを読み込めません');return}
  const items=o&&o.data&&Array.isArray(o.data.items)?o.data.items:(o&&Array.isArray(o.items)?o.items:null);if(!items){toast('SSSのバックアップではありません');return}
  const have=new Set(S.items.map(i=>i.sssId).filter(Boolean));let n=0,skip=0;
  for(const x of items){if(!x||x.st==='sold')continue;if(x.inSet){skip++;continue}if(have.has(String(x.id)))continue;S.items.push(fromSSSItem(x));have.add(String(x.id));n++}
  save();render2();toast(`${n}件を追加しました${skip?`（セットに束ねた単巻${skip}件は除外）`:''}`)}
function fromURL(){let q;try{q=new URLSearchParams(location.search)}catch(e){return}const src=q.get('src');if(src!=='posta'&&src!=='sss')return;
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  const g=k=>q.get(k)||'';const sid=g('sssId'),pid=g('postaId');
  let it=S.items.find(i=>(sid&&i.sssId===sid)||(pid&&i.postaId===pid));
  if(!it){it=newItem({sssId:sid,postaId:pid,title:g('title')||g('work')||'（無題）',work:g('work'),setk:mapSetk(g('setk')),shoban:tri(g('shoban')),obi:tri(g('obi')),bonus:g('bonus')==='1',condBad:g('cond')==='bad'});S.items.push(it);save();toast('連携から商品を作成しました')}
  else{if(pid&&!it.postaId)it.postaId=pid;if(sid&&!it.sssId)it.sssId=sid;save()}
  UI.view=it.id}

/* ---------- 容量・永続化・移行 ---------- */
const fmtMB=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':(n/1048576).toFixed(1)+' MB';
async function showUsage(){const e=$('#usage');if(!e)return;let photos=0,cnt=0;try{for(const r of await idbAll()){const b=srcOf(r);if(b){photos+=b.size+(r.cur&&r.orig?r.cur.size:0);cnt++}}}catch(_){}
  let site=null;try{if(navigator.storage&&navigator.storage.estimate){const est=await navigator.storage.estimate();site=est.usage}}catch(_){}
  const el=$('#usage');if(el)el.innerHTML=`${site!=null?`${fmtMB(site)}（このサイトの使用量）<br>`:''}写真データ ${fmtMB(photos)}（${cnt}枚）`}
async function migrate101(){if(S.mig101)return;let recs=[];try{recs=await idbAll()}catch(e){return}
  const byId=new Map();for(const it of S.items)for(const sh of it.shots)if(sh.imgId)byId.set(sh.imgId,sh);
  for(const r of recs){if(!r||!r.cur)continue;try{const sh=byId.get(r.id);const edited=sh&&!isPlain(sh.edit);
      // 編集済み：見た目を変えないため cur をマスターに繰り上げ、編集パラメータはリセット
      const rec={id:r.id,orig:(edited||!r.orig)?r.cur:r.orig,at:r.at||Date.now()};await idbPut(rec);
      if(sh){if(edited)sh.edit={};sh.base={}}}catch(e){}}
  S.mig101=1;save()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

/* ---------- 書き出し ---------- */
const safeName=t=>String(t||'koma').replace(/[\\\/:*?"<>|\r\n\t]/g,'').replace(/\s+/g,'_').slice(0,60)||'koma';
async function exportFiles(it){const list=it.shots.filter(s=>s.imgId);const files=[];const base=safeName(it.title);
  for(let i=0;i<list.length;i++){let b=await shotBlob(list[i]);if(!b)continue;
    if(files.length===0&&it.banner&&it.banner.on&&bannerText(it))b=await withBanner(b,bannerText(it));
    files.push(new File([b],`${base}_${String(files.length+1).padStart(2,'0')}.jpg`,{type:'image/jpeg'}))}
  return files}
function download(files){files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)},i*400))}

/* ============================================================
   操作
   ============================================================ */
const A={
  closeSheet(){closeSheet()},
  back(){UI.view='list';UI.col=false;UI.sel={};UI.prepared=null;render2();$('#view').scrollTop=0},
  open(b){UI.view=b.dataset.id;UI.col=false;UI.sel={};UI.prepared=null;render2();$('#view').scrollTop=0},
  addOpen(){openSheet('商品を追加',`<div class="fld"><label>商品名（これだけでOK）</label><input id="aT" placeholder="例：BORUTO 1〜15巻 途中セット"></div>
    <div class="fld"><label>区分</label><select id="aK">${SETK.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn pri" style="width:100%" data-act="addDo">追加して撮影へ</button>
    <div class="note" style="margin-top:8px">初版・帯・特典・状態は撮影画面で切り替えられます。</div>`);setTimeout(()=>$('#aT').focus(),50)},
  addDo(){const t=($('#aT').value||'').trim();if(!t){toast('商品名を入力してください');return}let k=$('#aK').value;if(k==='単品'&&/\d+\s*[-〜~]\s*\d+\s*巻|セット/.test(t))k=/全巻/.test(t)?'全巻セット':'途中セット';
    const it=newItem({title:t,setk:k});S.items.push(it);save();closeSheet();UI.view=it.id;render2()},
  flag(b){const it=getI(UI.view);const k=b.dataset.k,v=b.dataset.v;if(k==='bonus'||k==='condBad')it[k]=v==='1';else it[k]=v;regen(it);save();UI.prepared=null;render2()},
  up(b){const it=getI(UI.view);const i=+b.dataset.i;if(i<1)return;[it.shots[i-1],it.shots[i]]=[it.shots[i],it.shots[i-1]];finalize(it);save();UI.prepared=null;render2()},
  down(b){const it=getI(UI.view);const i=+b.dataset.i;if(i>=it.shots.length-1)return;[it.shots[i+1],it.shots[i]]=[it.shots[i],it.shots[i+1]];finalize(it);save();UI.prepared=null;render2()},
  async photoDel(b){const it=getI(UI.view);const s=it.shots[+b.dataset.i];if(!s||!confirm(`「${s.label}」の写真を削除しますか？`))return;await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId);
    if(s.collage){it.shots.splice(+b.dataset.i,1)}else{s.imgId=null;s.edit={};s.base={}}finalize(it);save();UI.prepared=null;render2()},
  async shotDel(b){const it=getI(UI.view);const i=+b.dataset.i;const s=it.shots[i];if(!s||s.required)return;if(!confirm(`ショット「${s.label}」を削除しますか？`))return;if(s.imgId){await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId)}it.shots.splice(i,1);finalize(it);save();UI.prepared=null;render2()},
  addNarabi(){const it=getI(UI.view);const s=mkShot('narabi',false);s.optional=true;it.shots.push(s);finalize(it);save();render2()},
  addCustom(){const it=getI(UI.view);const l=($('#cusL').value||'').trim();if(!l){toast('ラベルを入力してください');return}it.shots.push({key:'c_'+uid(),label:l,required:false,imgId:null,cover:false,custom:true});finalize(it);save();render2()},
  edit(b){openEdit(+b.dataset.i)},
  eAuto(){applyEdit(s=>{s.edit.auto=!s.edit.auto})},eRot(){applyEdit(s=>{s.edit.rot=((s.edit.rot||0)+1)%4})},eSq(){applyEdit(s=>{s.edit.square=!s.edit.square})},eUndo(){applyEdit(s=>{s.edit=JSON.parse(JSON.stringify(s.base||{}))})},
  cropReset(){applyEdit(s=>{s.edit.crop={x:0,y:0,scale:1}})},
  async setModel(b){const it=getI(UI.view);const s=it.shots[+b.dataset.i];const bl=await shotBlob(s);if(!bl)return;const old=S.models[s.key];const id='m_'+uid();
    await idbPut({id,orig:bl,at:Date.now()});S.models[s.key]=id;if(old){await idbDel(old).catch(()=>{});dropURL(old)}save();render2();toast(`「${s.label}」のお手本に登録しました`)},
  async modelView(b){const u=await imgURL(S.models[b.dataset.k]);openSheet(`お手本：${(DEFS[b.dataset.k]||{}).label||''}`,`<div class="pv"><img src="${u}" alt=""></div><label class="row"><input type="checkbox" class="chk" id="gridOn" ${UI.grid?'checked':''}> グリッドを表示</label>`);wireGrid()},
  async compare(b){const it=getI(UI.view);const s=it.shots[+b.dataset.i];const a=await imgURL(S.models[s.key]),c=await shotURL(s.imgId,s.edit,1200);
    openSheet(`比較：${s.label}`,`<div class="cmp"><div><div class="note">お手本</div><div class="pv"><img src="${a}" alt=""></div></div><div><div class="note">今回</div><div class="pv"><img src="${c}" alt=""></div></div></div>
    <label class="row"><input type="checkbox" class="chk" id="gridOn" ${UI.grid?'checked':''}> グリッドを表示して画角を比べる</label>`);wireGrid()},
  colMode(){UI.col=!UI.col;UI.sel={};render2()},
  async colDo(b){const it=getI(UI.view);const n=+b.dataset.n;const idx=Object.keys(UI.sel).filter(k=>UI.sel[k]).map(Number).sort((x,y)=>x-y);
    if(idx.length<2){toast('2枚以上選んでください');return}if(idx.length>n*n){toast(`${n}×${n}は${n*n}枚までです`);return}
    const bad=idx.filter(i=>READABLE.includes(it.shots[i].key));
    if(bad.length&&!confirm(`「${bad.map(i=>it.shots[i].label).join('」「')}」は文字が読めることが大事な写真です。分割すると文字が読めなくなります。それでも含めますか？`))return;
    toast('合成中…');const blobs=[];for(const i of idx){const bl=await shotBlob(it.shots[i]);if(bl)blobs.push(bl)}
    const out=await collage(blobs,n);const id=uid();await idbPut({id,orig:out,at:Date.now()});
    it.shots.push({key:'col_'+uid(),label:`分割合成 ${n}×${n}（${idx.length}枚）`,required:false,imgId:id,cover:false,custom:true,collage:true});
    UI.col=false;UI.sel={};finalize(it);save();UI.prepared=null;render2();toast('合成画像を追加しました（元の写真はそのままです）')},
  bnReset(){const it=getI(UI.view);it.banner=Object.assign({on:false},it.banner,{text:''});save();UI.prepared=null;render2()},
  async bnPreview(){const it=getI(UI.view);const f=it.shots.find(s=>s.imgId);if(!f){toast('先に1枚目の写真を撮ってください');return}const fb=await shotBlob(f);if(!fb)return;
    const b=await withBanner(fb,bannerText(it));const u=URL.createObjectURL(b);openSheet('カバー文字入れのプレビュー',`<div class="pv"><img src="${u}" alt=""></div><div class="note">書き出す1枚目にだけ合成されます。元の写真は変わりません。</div>`)},
  async exportPrep(){const it=getI(UI.view);if(it.banner&&it.banner.on&&!bannerFits(bannerText(it))&&!confirm('カバー文字が長すぎて、帯に収まりきりません（右端が切れます）。このまま書き出しますか？'))return;toast('書き出しの準備中…');const files=await exportFiles(it);if(!files.length){toast('写真がありません');return}
    UI.prepared={id:it.id,files};render2();toast('準備できました。「共有シートを開く」を押してください')},
  async shareGo(){const P=UI.prepared;if(!P)return;const files=P.files;
    if(navigator.canShare&&navigator.share&&navigator.canShare({files})){try{await navigator.share({files});return}catch(e){if(e&&e.name==='AbortError')return}}
    download(files);toast('この環境では共有シートが使えないため、1枚ずつダウンロードします')},
  toPosta(){const it=getI(UI.view);const base=String(S.settings.postaUrl||'').trim();if(!base){toast('設定でPOSTAのURLを入力してください');return}
    if(!it.sssId&&!it.postaId){toast('この商品はSSS／POSTAとつながっていないため、伝える先がありません');return}
    const ps=[['src','koma'],['act','shot'],['sssId',it.sssId],['postaId',it.postaId]].filter(([k,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    location.href=base+(base.includes('?')?'&':'?')+ps},
  async delItem(){const it=getI(UI.view);if(!confirm(`「${it.title}」を削除しますか？（写真も消えます）`))return;for(const s of it.shots)if(s.imgId){await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId)}
    S.items=S.items.filter(x=>x.id!==it.id);save();A.back()},
  openSet(){openSheet('設定',`<div class="card"><div class="sec" style="margin-top:0">バックアップ</div><div class="note" style="margin-bottom:8px">⚠ バックアップには<b>写真は含まれません</b>（商品・撮影リスト・進捗などの情報のみ）。写真は端末内（このブラウザ）に保存されています。</div>
    <div class="btns"><button class="btn pri" data-act="bkOut">書き出す</button><label class="btn pick">読み込む（置き換え）<input type="file" id="bkIn" accept=".json,application/json,text/plain"></label></div></div>
    <div class="card"><div class="sec" style="margin-top:0">写真の使用容量</div><div id="usage" class="prog">計算中…</div>
    <button class="btn dng" style="margin-top:8px" data-act="purgeDone">撮影完了した商品の写真をまとめて削除</button><div class="note" style="margin-top:6px">写真だけを消します。商品・撮影リスト・進捗の情報は残り、そのショットは未撮影に戻ります。</div></div>
    <div class="card"><div class="fld"><label>POSTAのURL</label><input id="postaUrl" value="${esc(S.settings.postaUrl)}"></div></div>
    <div class="card"><button class="btn dng" data-act="wipe">すべてのデータを消去</button><div class="note" style="margin-top:6px">商品・写真・お手本がすべて消えます。</div></div>
    <div class="note">KOMA v${APP_VER}／商品 ${S.items.length}件</div>`);showUsage()},
  async purgeDone(){const its=S.items.filter(i=>i.status==='撮影完了');const ids=[];for(const it of its)for(const s of it.shots)if(s.imgId)ids.push(s.imgId);
    if(!ids.length){toast('撮影完了した商品の写真はありません');return}let sz=0;for(const id of ids){const r=await idbGet(id).catch(()=>null);const b=srcOf(r);if(b)sz+=b.size}
    if(!confirm(`撮影完了した商品 ${its.length}件の写真 ${ids.length}枚（約${fmtMB(sz)}）を削除します。商品と進捗の情報は残ります。よろしいですか？`))return;
    for(const it of its){for(const s of it.shots)if(s.imgId){await idbDel(s.imgId).catch(()=>{});dropURL(s.imgId);s.imgId=null;s.edit={};s.base={}}it.shots=it.shots.filter(s=>!s.collage);finalize(it)}
    save();showUsage();render2();toast(`${ids.length}枚の写真を削除しました`)},
  bkOut(){const t=JSON.stringify({app:'KOMA',key:KEY,ver:APP_VER,exportedAt:new Date().toISOString(),note:'写真は含まれません',data:S});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
    const d=new Date();a.download=`koma_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('書き出しました（写真は含まれません）')},
  async wipe(){if(!confirm('商品・写真・お手本をすべて消去します。元に戻せません。よろしいですか？'))return;await idbClear().catch(()=>{});URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();S=defState();save();closeSheet();UI.view='list';render2();toast('消去しました')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||b.tagName==='INPUT')return;if(e.target.tagName==='INPUT')return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.shot!==undefined&&el.files&&el.files[0]){const f=el.files[0];el.value='';await importPhoto(+el.dataset.shot,f);return}
  if(el.dataset.col!==undefined){UI.sel[el.dataset.col]=el.checked;render2();return}
  if(el.id==='gridOn'){UI.grid=el.checked;wireGrid();cropGrid();return}
  if(el.id==='bnOn'){const it=getI(UI.view);it.banner=Object.assign({text:''},it.banner,{on:el.checked});save();UI.prepared=null;render2();return}
  if(el.id==='bnTx'){const it=getI(UI.view);const v=el.value.replace(/\s*\n\s*/g,' ').trim();it.banner=Object.assign({on:false},it.banner,{text:v===bannerDefault(it)?'':v});save();UI.prepared=null;const w=document.getElementById('bnWarn');if(w)w.hidden=bannerFits(bannerText(it));return}
  if(el.id==='postaUrl'){S.settings.postaUrl=el.value.trim();save();toast('保存しました');return}
  if(el.id==='sssF'&&el.files[0]){await sssImport(el.files[0]);el.value='';return}
  if(el.id==='bkIn'&&el.files[0]){let o;try{o=JSON.parse(await el.files[0].text())}catch(_){toast('JSONを読み込めません');return}const d=o&&o.app==='KOMA'&&o.data?o.data:o;
    if(!d||!Array.isArray(d.items)){toast('KOMAのバックアップではありません');return}if(!confirm(`今のデータ（商品${S.items.length}件）を、バックアップ（商品${d.items.length}件）で置き換えます。写真はバックアップに含まれないため、端末に残っている写真だけが表示されます。よろしいですか？`))return;
    S=fix(d);save();closeSheet();UI.view='list';render2();toast('読み込みました')}
});
fromURL();render2();migrate101().then(()=>{URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();render2()});
</script>
</body>
</html>
